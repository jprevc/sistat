[project]
name = "sistat"
version = "0.1.0"
description = "Python client for SiStat, the database of the Statistical Office of Slovenia (SURS), via its PxWeb API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["slovenia", "statistics", "surs", "sistat", "pxweb", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.urls]
Repository = "https://github.com/jprevc/sistat"

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real SiStat API (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
